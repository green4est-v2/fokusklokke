<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gi meg litt fred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one centred column. The whole session is a ring of 9 arcs (focus = coral, pause = mint)
   with rolling digits in the middle; a soft colour wash behind the page follows the current phase. */
:root{
  --bg:#FFF4E8; --surface:#FFFBF6; --ink:#2A1F3D; --muted:#6B5F7D; --line:#EBDCCB;
  --focus:#E8553B; --focus-ink:#B3361F; --focus-soft:#FCE1D8; --btn-focus:#C8402A; --on-focus:#FFFFFF;
  --break:#1FAF94; --break-ink:#0B7360; --break-soft:#D3F2EA; --btn-break:#1FAF94; --on-break:#1C1530;
  --sun:#FFC23C; --sun-soft:#FFF0C7; --danger:#B8352A;
  --focus-wash:rgba(232,85,59,.20); --break-wash:rgba(31,175,148,.20); --sun-wash:rgba(255,194,60,.26);
  --shadow:rgba(42,31,61,.22); --overlay:rgba(42,31,61,.45);
  --display:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1530; --surface:#241D3F; --ink:#F5EFFF; --muted:#ABA1C4; --line:#3A3159;
  --focus:#FF7E63; --focus-ink:#FF9C86; --focus-soft:#3E2440; --btn-focus:#FF7E63; --on-focus:#1A1530;
  --break:#4FE0C1; --break-ink:#6EEBD0; --break-soft:#173B3D; --btn-break:#4FE0C1; --on-break:#1A1530;
  --sun:#FFD15C; --sun-soft:#3D3320; --danger:#FF8A7A;
  --focus-wash:rgba(255,126,99,.16); --break-wash:rgba(79,224,193,.14); --sun-wash:rgba(255,209,92,.12);
  --shadow:rgba(0,0,0,.45); --overlay:rgba(8,5,20,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1530; --surface:#241D3F; --ink:#F5EFFF; --muted:#ABA1C4; --line:#3A3159;
  --focus:#FF7E63; --focus-ink:#FF9C86; --focus-soft:#3E2440; --btn-focus:#FF7E63; --on-focus:#1A1530;
  --break:#4FE0C1; --break-ink:#6EEBD0; --break-soft:#173B3D; --btn-break:#4FE0C1; --on-break:#1A1530;
  --sun:#FFD15C; --sun-soft:#3D3320; --danger:#FF8A7A;
  --focus-wash:rgba(255,126,99,.16); --break-wash:rgba(79,224,193,.14); --sun-wash:rgba(255,209,92,.12);
  --shadow:rgba(0,0,0,.45); --overlay:rgba(8,5,20,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;margin:0;transition:background-color .5s,color .5s}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:22px 56px;display:grid;gap:22px;position:relative}

/* phase colour wash behind everything */
.bgwash{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgwash span{position:absolute;inset:-25%;opacity:0;transition:opacity 1.4s ease}
.bgwash .wi{background:radial-gradient(circle at 20% 15%,var(--sun-wash),transparent 45%),radial-gradient(circle at 85% 80%,var(--focus-wash),transparent 40%)}
.bgwash .wf{background:radial-gradient(circle at 25% 20%,var(--focus-wash),transparent 48%),radial-gradient(circle at 80% 85%,var(--sun-wash),transparent 42%)}
.bgwash .wb{background:radial-gradient(circle at 75% 15%,var(--break-wash),transparent 48%),radial-gradient(circle at 15% 85%,var(--sun-wash),transparent 42%)}
body[data-phase="idle"] .wi,body[data-phase="focus"] .wf,body[data-phase="break"] .wb{opacity:1}

header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:grid;gap:2px;min-width:0}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0;text-wrap:balance}
h1 .dot{color:var(--focus)}
.sub{color:var(--muted);font-size:.82rem;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none;border-radius:50%}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:spin .6s cubic-bezier(.34,1.56,.64,1)}

/* buttons: chunky and pressable */
button{font:700 .95rem var(--body);border-radius:999px;padding:11px 20px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 var(--shadow);transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,background-color .3s,border-color .2s}
button:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--shadow)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary.focus{background:var(--btn-focus);border-color:var(--btn-focus);color:var(--on-focus)}
button.primary.break{background:var(--btn-break);border-color:var(--btn-break);color:var(--on-break)}
button.ghost{background:transparent;border-color:transparent;box-shadow:none;font-weight:600;color:var(--muted)}
button.ghost:hover{color:var(--ink);box-shadow:none}

/* the ring */
.clock{display:grid;gap:16px;justify-items:center;text-align:center}
.ring{position:relative;width:min(100%,380px);aspect-ratio:1;max-width:100%}
.ringwrap{position:absolute;inset:0}
.ringwrap.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc path{fill:none;stroke-width:18;stroke-linecap:round}
.arc.focus path{stroke:var(--focus)}
.arc.break path{stroke:var(--break)}
.arc .trk{stroke-opacity:.18}
.arc .prog{transition:stroke-opacity .4s}
.arc.done .prog{stroke-opacity:.55}
.arc.current .trk{stroke-opacity:.28}
.arc.current .prog{filter:drop-shadow(0 0 7px var(--focus))}
.arc.break.current .prog{filter:drop-shadow(0 0 7px var(--break))}
.arc.grow path{animation:grow .8s cubic-bezier(.34,1.56,.64,1)}
.arc.flash .prog{animation:flash .9s ease-out}
.arc .lbl{font:700 13px var(--body);fill:var(--muted);text-anchor:middle;dominant-baseline:central;transition:fill .3s}
.arc.current .lbl{fill:var(--ink)}
.head{fill:var(--surface);stroke-width:5;transition:opacity .3s}
.head.focus{stroke:var(--focus)} .head.break{stroke:var(--break)}
.ring.paused .arc.current path,.ring.paused .head{animation:breathe 2.6s ease-in-out infinite}
.ripple{position:absolute;inset:6%;border-radius:50%;border:5px solid var(--focus);pointer-events:none;animation:ripple 1.1s cubic-bezier(.2,.7,.3,1) forwards}
.ripple.break{border-color:var(--break)}
.ripple.sun{border-color:var(--sun)}

.center{position:absolute;inset:16%;display:grid;place-content:center;justify-items:center;gap:6px}
.phase{font:700 .74rem var(--body);text-transform:uppercase;letter-spacing:.14em;padding:5px 12px;border-radius:99px;transition:background-color .4s,color .4s}
.phase.focus{background:var(--focus-soft);color:var(--focus-ink)}
.phase.break{background:var(--break-soft);color:var(--break-ink)}
.phase.idle{background:var(--sun-soft);color:var(--ink)}
.time{font-family:var(--display);font-weight:600;font-size:clamp(2.7rem,14vw,4.6rem);line-height:1;display:flex;justify-content:center;transition:opacity .4s}
.slot{position:relative;display:inline-block;width:.6em;height:1.12em;overflow:hidden}
.slot.colon{width:.3em}
.dg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dg.in{animation:rollIn .42s cubic-bezier(.34,1.56,.64,1)}
.dg.out{animation:rollOut .3s ease-in forwards}
.ring.running .colon .dg{animation:tick 1s ease-in-out infinite}
.ring.paused .time{opacity:.5}
.round{font-size:.85rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.meta{color:var(--muted);font-size:.95rem;font-weight:600;min-height:1.5em}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.opts{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center;font-size:.86rem;color:var(--muted);font-weight:600}
.opts label{display:flex;gap:7px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--focus);width:16px;height:16px}

/* banner */
.alert{border-radius:20px;padding:14px 16px 14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700;border:2px solid;animation:dropIn .55s cubic-bezier(.34,1.56,.64,1)}
.alert span{min-width:0;flex:1 1 220px}
.alert.focus{background:var(--focus-soft);border-color:var(--focus)}
.alert.break{background:var(--break-soft);border-color:var(--break)}
.alert.sun{background:var(--sun-soft);border-color:var(--sun)}

/* log */
.log{display:grid;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.log h2,.export h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0}
.log-hint{color:var(--muted);font-size:.9rem;margin:0;font-weight:600}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.addrow input::placeholder{color:var(--muted)}
.group{border-top:2px dashed var(--line);padding-top:10px}
.group h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 4px;font-weight:800}
.group.active h3{color:var(--break-ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0}
li.new{animation:slideIn .5s cubic-bezier(.34,1.56,.64,1)}
li .txt{min-width:0;overflow-wrap:anywhere;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ck{width:18px;height:18px;flex:none;align-self:center;fill:none;stroke:var(--break);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ck path{stroke-dasharray:20;stroke-dashoffset:0}
li.new .ck path{animation:draw .5s .2s ease-out backwards}
li .tm{font-size:.74rem;font-weight:800;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
li button{padding:3px 10px;font-size:.8rem;border:none;background:none;box-shadow:none;color:var(--muted)}
li button:hover{color:var(--danger);box-shadow:none}
.empty{color:var(--muted);font-size:.9rem;font-style:italic;margin:0}
.foot{display:flex;gap:10px;flex-wrap:wrap}
.toast{font-size:.86rem;color:var(--muted);font-weight:600}

/* export */
.export{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:14px;transition:border-color .4s,box-shadow .4s}
.export.fresh{border-color:var(--sun);box-shadow:0 0 0 5px var(--sun-soft)}
.export p{margin:0;color:var(--muted);font-size:.9rem;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:7px 16px;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{border:2px solid var(--line);border-radius:14px;padding:12px;max-height:320px;overflow:auto;background:var(--bg);font-size:.88rem}
.preview table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.preview th,.preview td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.preview th{font-weight:800;background:var(--surface)}
.preview pre{margin:0;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.preview h4{margin:10px 0 4px;font-size:.92rem}
.preview h4:first-child{margin-top:0}
.preview ul{list-style:disc;padding-left:20px;display:block}
.preview li{display:list-item;padding:1px 0}
.exrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* reminder sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:10;animation:fadeIn .25s ease}
.sheet{background:var(--surface);color:var(--ink);border-radius:26px;border:2px solid var(--line);max-width:460px;width:100%;padding:22px;display:grid;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:sheetIn .5s cubic-bezier(.34,1.56,.64,1)}
.sheet h2{font-family:var(--display);font-weight:600;font-size:1.4rem;margin:0;text-wrap:balance}
.sheet p{margin:0;color:var(--muted)}
.sheet .ok{color:var(--break-ink);font-weight:800}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row.end{justify-content:flex-end;border-top:2px dashed var(--line);padding-top:12px}

/* background status */
.keep{margin:0;font-size:.82rem;font-weight:700;padding:5px 12px;border-radius:99px;display:inline-flex;align-items:center;gap:8px}
.keep::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.keep.on{background:var(--break-soft);color:var(--break-ink)}
.keep.on::before{animation:tick 2s ease-in-out infinite}
.keep.off{background:var(--sun-soft);color:var(--ink);cursor:pointer}

.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes grow{0%{stroke-width:2}60%{stroke-width:26}100%{stroke-width:18}}
@keyframes flash{0%{stroke-opacity:1;stroke-width:28}100%{stroke-width:18}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ripple{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes rollIn{0%{transform:translateY(70%);opacity:0}100%{transform:none;opacity:1}}
@keyframes rollOut{0%{transform:none;opacity:1}100%{transform:translateY(-70%);opacity:0}}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dropIn{0%{transform:translateY(-14px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideIn{0%{transform:translateX(-22px);opacity:0}100%{transform:none;opacity:1}}
@keyframes draw{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
@keyframes spin{0%{transform:rotate(-120deg) scale(.6)}100%{transform:none}}
@keyframes fadeIn{0%{opacity:0}}
@keyframes sheetIn{0%{transform:translateY(24px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(3%,-2%)}}
@media (prefers-reduced-motion: no-preference){.bgwash span{animation:drift 18s ease-in-out infinite alternate}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
  button:hover,button:active{transform:none}
}
</style>

<div class="bgwash" aria-hidden="true"><span class="wi"></span><span class="wf"></span><span class="wb"></span></div>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Gi meg litt fred<span class="dot">.</span></h1>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Bytt til mørkt tema" title="Bytt tema"></button>
  </header>

  <div class="alert" id="alert" hidden>
    <span id="alertText"></span>
    <button class="primary" id="alertBtn">La oss gå</button>
  </div>

  <section class="clock" aria-label="Tidtaker">
    <div class="ring" id="ring">
      <div class="ringwrap" id="ringwrap">
        <svg id="ringSvg" viewBox="0 0 360 360" aria-hidden="true"></svg>
        <div class="center">
          <span class="phase idle" id="phase">Klar?</span>
          <div class="time" id="time" role="timer" aria-label="50:00"></div>
          <span class="round" id="round">9 runder · 200 min</span>
        </div>
      </div>
    </div>
    <div class="meta" id="meta">Trykk «Lås inn», så kjører vi på.</div>
    <div class="controls">
      <button class="primary" id="startNew">Lås inn</button>

    </div>
    <p class="keep" id="keepState" hidden role="status"></p>
    <div class="opts">
      <label><input type="checkbox" id="autoNext"> Kjør neste runde automatisk</label>
      <label><input type="checkbox" id="sound" checked> Lyd</label>
      <label><input type="checkbox" id="keepAwakeBox" checked> Hold våken i bakgrunnen</label>
      <button class="ghost" id="notifBtn" hidden>Gi meg varsler på PC-en</button>
      <button class="ghost" id="lampBtn" hidden>Koble til lampe</button>
    </div>
  </section>

  <section class="log" id="logSection">
    <h2>Dette fikk jeg gjort</h2>
    <p class="log-hint" id="logHint">During each 10‑minute break, note what you got done in the focus block before it.</p>
    <form class="addrow" id="addForm" hidden>
      <input id="taskInput" type="text" placeholder="Gjort eller tenkt på noe lurt?" autocomplete="off" aria-label="Ting du fikk gjort">

</div>

<script>
(function(){
document.documentElement.lang='nb';
const PLAN=[50,10,40,10,30,10,20,10,10].map((m,i)=>({m,type:i%2===0?'focus':'break'}));
const KEY='stepdown-timer-v1';
const $=id=>document.getElementById(id);
let S=load()||fresh();
S.times=S.times||{};
let fmtSel='excel', justFinished=false, newestAt=null;
let audioCtx=null, flashTimer=null;

function fresh(){return{idx:0,status:'idle',endAt:0,remaining:PLAN[0].m*60000,logs:{},times:{},auto:false,sound:true}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* --- background ticking: a Worker keeps time even when the tab is hidden --- */
let worker=null;
try{
  const src='let t=null;onmessage=e=>{if(e.data==="start"){clearInterval(t);t=setInterval(()=>postMessage(1),500)}else{clearInterval(t)}}';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage=tick;
}catch(e){worker=null}
let fallback=null;
function runTicker(on){
  if(worker){worker.postMessage(on?'start':'stop');return}
  clearInterval(fallback); if(on) fallback=setInterval(tick,500);
}

function remainingNow(){return S.status==='running'?Math.max(0,S.endAt-Date.now()):S.remaining}
function fmt(ms){const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function labelFor(i){
  const p=PLAN[i]; const n=PLAN.slice(0,i+1).filter(x=>x.type===p.type).length;
  return p.type==='focus'?`Fokus ${n} av 5 · ${p.m} min`:`Pause ${n} av 4 · ${p.m} min`;
}

function tick(){
  if(S.status!=='running')return;
  if(remainingNow()<=0){complete(true);return}
  renderClock();
}

// at = when the segment really started (used when catching up after the tab slept)
function startSegment(i,at){
  const t0=at||Date.now();
  S.idx=i; S.times[i]={s:t0}; S.status='running'; S.endAt=t0+PLAN[i].m*60000; S.remaining=PLAN[i].m*60000; S.lateEnd=null;
  stopFlash(); save(); runTicker(true); keepAwake(true); render(); growArc(i);
}
// natural = the timer ran out (not skipped). Then the end time is the scheduled one, not "now".
function complete(natural){
  const done=S.idx, now=Date.now(), endT=natural?Math.min(S.endAt,now):now;
  S.remaining=0;
  S.times[done]=Object.assign(S.times[done]||{},{e:endT});
  S.lateEnd=natural&&now-endT>15000?endT:null;
  if(done===PLAN.length-1){S.status='finished';justFinished=true;}
  else{S.status='between';}
  const chain=S.status==='between'&&S.auto;
  const nextAlsoOver=chain&&natural&&endT+PLAN[done+1].m*60000<=now;
  save(); runTicker(false);
  if(!chain)keepAwake(false);
  if(!nextAlsoOver)announce(done);
  render();
  if(chain){startSegment(done+1,natural?endT:undefined);tick()}
}

function announce(done){
  const last=done===PLAN.length-1, next=PLAN[done+1];
  const title=last?'Ferdig for nå!':(PLAN[done].type==='focus'?'Fokusøkta er over':'Pausen er slutt');
  const body=last?'Alle 9 rundene er unnagjort. Godt jobba!':(next.type==='break'?`Ta deg ${next.m} min pause, og skriv ned hva du fikk gjort.`:`Neste: ${next.m} min fokus. Kom igjen!`);
  chime(); celebrate(done); flash(title);
  try{if('Notification' in window&&Notification.permission==='granted'){new Notification(title,{body,tag:'stepdown'})}}catch(e){}
}

let doneBuf=null, decoding=false;
function loadDoneSound(){
  if(doneBuf||decoding||!audioCtx)return; decoding=true;
  fetch(DONE_SOUND).then(r=>r.arrayBuffer()).then(a=>new Promise((res,rej)=>audioCtx.decodeAudioData(a,res,rej)))
    .then(b=>{doneBuf=b}).catch(()=>{}).finally(()=>{decoding=false});
}
function beep(){
  const t0=audioCtx.currentTime;
  [660,880,990].forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);
    const s=t0+i*0.22;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.9);
    o.start(s);o.stop(s+1);
  });
}
function chime(){
  if(!S.sound)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended'&&audioCtx.resume)audioCtx.resume();
    if(doneBuf){const src=audioCtx.createBufferSource();src.buffer=doneBuf;src.connect(audioCtx.destination);src.start();return}
    try{const a=new Audio(DONE_SOUND);a.play().catch(beep)}catch(e){beep()}
  }catch(e){}
}
function flash(msg){
  stopFlash(); let on=false;
  flashTimer=setInterval(()=>{document.title=(on=!on)?'⏰ '+msg:'Gi meg litt fred'},1000);
}
function stopFlash(){clearInterval(flashTimer);flashTimer=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.status!=='between'&&S.status!=='finished')stopFlash();tick();render();if(pendingCelebrate!==null)setTimeout(()=>celebrate(pendingCelebrate),250)}});

function unlockAudio(){try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(!audioCtx._watched){audioCtx._watched=1;audioCtx.onstatechange=renderKeep}
  const r=audioCtx.resume&&audioCtx.resume(); if(r&&r.then)r.then(()=>{keepAwake(S.status==='running')});
  loadDoneSound(); keepAwake(S.status==='running');
}catch(e){}}
/* Browsers put background tabs to sleep after a few minutes, and a sleeping tab can't play the alert.
   A tab that is playing sound is kept awake, so while a timer runs we play a very quiet 40 Hz hum
   (about -54 dB, well below what laptop speakers or headphones reproduce at normal volume). */
let keepOsc=null, keepGain=null;
function keepAwake(on){
  const want=on&&S.keepAwake!==false&&S.status==='running';
  if(!want){
    if(keepOsc){try{keepOsc.stop()}catch(e){} try{keepOsc.disconnect();keepGain.disconnect()}catch(e){} keepOsc=keepGain=null}
  }else if(!keepOsc&&audioCtx&&audioCtx.state==='running'){
    try{
      keepOsc=audioCtx.createOscillator();keepGain=audioCtx.createGain();
      keepOsc.frequency.value=40;keepGain.gain.value=0.002;
      keepOsc.connect(keepGain);keepGain.connect(audioCtx.destination);keepOsc.start();
    }catch(e){keepOsc=keepGain=null}
  }
  renderKeep();
}
function renderKeep(){
  const el=$('keepState'); if(!el)return;
  const running=S.status==='running';
  if(!running||S.keepAwake===false){el.hidden=true;return}
  el.hidden=false;
  const ok=keepOsc&&audioCtx&&audioCtx.state==='running';
  el.className='keep '+(ok?'on':'off');
  el.textContent=ok?'Holder seg våken i bakgrunnen':'Trykk hvor som helst på siden, så varsler den deg i bakgrunnen også';
}
// any click on the page unlocks audio, so a resumed session after reload can still play the sound
document.addEventListener('pointerdown',unlockAudio);
$('sound').addEventListener('change',e=>{if(e.target.checked){unlockAudio();setTimeout(chime,150)}});

/* --- controls --- */
function beginFresh(){
  $('remind').hidden=true; delete $('startNew').dataset.confirm;
  unlockAudio(); const auto=S.auto,snd=S.sound,ka=S.keepAwake; S=fresh(); S.auto=auto; S.sound=snd; S.keepAwake=ka; startSegment(0);
}
$('startNew').onclick=()=>{
  if(rows().length&&!S.saved){openRemind();return}
  if(S.status!=='idle'&&S.status!=='finished'&&!$('startNew').dataset.confirm){
    $('startNew').dataset.confirm='1';$('startNew').textContent='Trykk en gang til for å nullstille';
    setTimeout(()=>{delete $('startNew').dataset.confirm;render()},3000);return;
  }
  beginFresh();
};
$('pauseBtn').onclick=()=>{
  if(S.status==='running'){S.remaining=remainingNow();S.status='paused';runTicker(false);keepAwake(false)}
  else if(S.status==='paused'){unlockAudio();S.endAt=Date.now()+S.remaining;S.status='running';runTicker(true);keepAwake(true);if(!reduced)retrigger($('ringwrap'),'pop')}
  save();render();
};
const goNext=()=>{unlockAudio();if(S.status==='between')startSegment(S.idx+1)};
$('nextBtn').onclick=goNext; $('alertBtn').onclick=goNext;
$('skipBtn').onclick=()=>{if(S.status==='running'||S.status==='paused'){S.endAt=Date.now();S.status='running';complete(false)}};
$('autoNext').onchange=e=>{S.auto=e.target.checked;save()};
$('sound').onchange=e=>{S.sound=e.target.checked;save()};
$('keepAwakeBox').onchange=e=>{S.keepAwake=e.target.checked;save();unlockAudio();keepAwake(S.keepAwake)};
$('notifBtn').onclick=async()=>{try{await Notification.requestPermission()}catch(e){} render()};

/* --- lamp: Galactic Unicorn on USB (Web Serial). Write-only; see lampe/main.py for the format. --- */
let lampW=null;
function lampMsg(){
  const st=S.status;
  if(st!=='running'&&st!=='paused')return {p:'idle'};
  const m={p:st==='paused'?'paused':PLAN[S.idx].type,left:Math.round(remainingNow()/1000)};
  if(st==='running')m.free=hm(S.endAt);
  return m;
}
function lampSend(){
  if(lampW)lampW.write(new TextEncoder().encode(JSON.stringify(lampMsg())+'\n')).catch(lampDrop);
}
function lampDrop(){lampW=null;renderLamp()}
async function lampOpen(port){
  try{await port.open({baudRate:115200});lampW=port.writable.getWriter();lampSend()}catch(e){lampW=null}
  renderLamp();
}

/* --- task log: tied to each break (what was done in the focus block before it) --- */
function logBreakIdx(){
  // which break should receive new entries right now
  if(PLAN[S.idx].type==='break'&&(S.status==='running'||S.status==='paused'))return S.idx;
  if(S.status==='between'&&PLAN[S.idx+1]&&PLAN[S.idx+1].type==='break')return S.idx+1;
  if(S.status==='between'&&PLAN[S.idx].type==='break')return S.idx;
  if(S.status==='finished')return PLAN.length; // wrap-up after the last 10 min
  return null;
}
$('addForm').onsubmit=e=>{
  e.preventDefault(); const v=$('taskInput').value.trim(); const b=logBreakIdx();
  if(!v||b===null)return;
  const fb=S.times[focusOf(b)]||{};
  const at=Date.now();
  (S.logs[b]=S.logs[b]||[]).push({t:v,at,s:fb.s,e:fb.e});S.saved=false;
  $('taskInput').value=''; save(); newestAt=at; renderLog(); newestAt=null; $('taskInput').focus();
};
function toast(m,id){const el=$(id||'toast');el.textContent=m;clearTimeout(el._t);el._t=setTimeout(()=>{el.textContent=''},2500)}
const hm=t=>{if(!t)return '';const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const rangeOf=(s0,e0)=>s0&&e0?hm(s0)+'–'+hm(e0):(s0?hm(s0)+'–':'');
function focusOf(b){return b==PLAN.length?PLAN.length-1:b-1}
function focusLabel(b){const f=focusOf(b);const n=PLAN.slice(0,f+1).filter(x=>x.type==='focus').length;return `Fokus ${n} · ${PLAN[f].m} min`}
function groupTitle(b){const t=S.times[focusOf(b)]||{};const r=rangeOf(t.s,t.e);return focusLabel(b)+(r?' · '+r:'')}
function entryRange(x,b){const t=S.times[focusOf(b)]||{};return rangeOf(x.s||t.s,x.e||t.e)}

/* --- export: Excel (tab-separated + table), Word (formatted), plain text --- */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rows(){
  const out=[];
  Object.keys(S.logs).map(Number).sort((a,b)=>a-b).forEach(k=>{
    (S.logs[k]||[]).forEach(x=>{
      const t=S.times[focusOf(k)]||{};const s0=x.s||t.s,e0=x.e||t.e;
      out.push({b:k,round:focusLabel(k),from:hm(s0),to:hm(e0),range:rangeOf(s0,e0),task:x.t,day:new Date(s0||x.at)});
    });
  });

}
const dateStr=d=>d.toLocaleDateString('nb-NO',{day:'2-digit',month:'2-digit',year:'numeric'});

function build(fmt){
  const r=rows();

    const body=r.map(x=>[dateStr(x.day),x.from,x.to,x.round,x.task]);
    const clean=v=>String(v).replace(/[\t\r\n]+/g,' ');
    return{
      plain:[head,...body].map(row=>row.map(clean).join('\t')).join('\n'),
      html:'<table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+row.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'

  }
  const g=grouped(r);
  if(fmt==='word'){
    return{
      plain:docTitle(r)+'\n\n'+g.map(x=>x.head+'\n'+x.items.map(i=>'• '+i.task).join('\n')).join('\n\n'),
      html:'<h3>'+esc(docTitle(r))+'</h3>'+g.map(x=>'<h4>'+esc(x.head)+'</h4><ul>'+x.items.map(i=>'<li>'+esc(i.task)+'</li>').join('')+'</ul>').join('')
    };
  }
  const plain=docTitle(r)+'\n\n'+r.map(x=>(x.range||'').padEnd(12)+x.task).join('\n');

}

    ?'I hver 10-minutterspause kan du skrive ned hva du fikk unna i økta før.'
    :`Havner under: ${groupTitle(active)}`;
  const keys=new Set(Object.keys(S.logs).filter(k=>S.logs[k].length).map(Number));
  if(active!==null)keys.add(active);
  const g=$('groups'); g.innerHTML='';
  renderExport();
  if(!keys.size){g.innerHTML='<p class="empty">Ingenting her ennå.</p>';return}

      const ckp=document.createElementNS(NS,'path');ckp.setAttribute('d','M4 10.5l4 4L16 6');ck.appendChild(ckp);sp.appendChild(ck);

// digits: one slot per character so each can roll on its own

    if(reduced||document.hidden){cur.textContent=c;return}
    cur.classList.remove('in');cur.classList.add('out');
    const n=document.createElement('span');n.className='dg in';n.textContent=c;sl.appendChild(n);
    setTimeout(()=>cur.remove(),320);
  });
}
function progressNow(){
  const p=PLAN[S.idx];
  if(S.status==='running'||S.status==='paused')return Math.min(1,Math.max(0,1-remainingNow()/(p.m*60000)));
  return 0;
}
function renderRing(){
  const st=S.status, active=st==='running'||st==='paused', pct=progressNow();
  arcs.forEach((a,i)=>{
    const done=i<S.idx||(i===S.idx&&(st==='between'||st==='finished'));
    const cur=i===S.idx&&active;
    a.g.classList.toggle('done',done);a.g.classList.toggle('current',cur);
    a.prog.setAttribute('stroke-dashoffset',done?0:cur?(100-pct*100).toFixed(3):100);
  });
  if(active){
    const a=arcs[S.idx],[x,y]=pt(a.a0+(a.a1-a.a0)*pct,RR);
    headEl.setAttribute('cx',x.toFixed(2));headEl.setAttribute('cy',y.toFixed(2));
    headEl.setAttribute('class','head '+PLAN[S.idx].type);headEl.style.opacity=1;
  }else headEl.style.opacity=0;
}
// smooth ring motion while the page is visible; the worker tick keeps time when it isn't
let raf=0;
function loop(){raf=0;if(S.status!=='running'||document.hidden)return;renderRing();raf=requestAnimationFrame(loop)}
function startLoop(){if(!raf&&S.status==='running'&&!document.hidden)raf=requestAnimationFrame(loop)}
function renderClock(){
  const rem=remainingNow(), p=PLAN[S.idx];
  setDigits(fmt(S.status==='idle'?p.m*60000:S.status==='finished'||S.status==='between'?0:rem));
  renderRing();
  if(S.status==='running'&&!flashTimer)document.title=fmt(rem)+' · '+(p.type==='focus'?'Fokus':'Pause');
}

/* --- celebrations: fired on the same frame as the alert sound --- */
let pendingCelebrate=null;
function retrigger(el,cls){el.classList.remove(cls);void el.getBoundingClientRect();el.classList.add(cls)}
function ripple(type,delay){
  setTimeout(()=>{const r=document.createElement('span');r.className='ripple '+type;$('ring').appendChild(r);setTimeout(()=>r.remove(),1200)},delay||0);
}
function celebrate(done){
  if(document.hidden){pendingCelebrate=done;return}
  pendingCelebrate=null;
  if(reduced)return;
  const type=PLAN[done].type;
  retrigger($('ringwrap'),'pop');
  const a=arcs[done]; if(a){retrigger(a.g,'flash');setTimeout(()=>a.g.classList.remove('flash'),950)}
  ripple(type);ripple(done===PLAN.length-1?'sun':(PLAN[done+1]||{}).type||type,180);
  if(done===PLAN.length-1)confetti();
}
function growArc(i){
  if(reduced||document.hidden||!arcs[i])return;
  retrigger(arcs[i].g,'grow');setTimeout(()=>arcs[i]&&arcs[i].g.classList.remove('grow'),850);
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function confetti(){
  if(reduced)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const r=$('ring').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['--focus','--break','--sun','--focus','--sun'].map(cssVar);
  const parts=Array.from({length:150},()=>{const a=Math.random()*Math.PI*2,v=4+Math.random()*9;
    return{x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],round:Math.random()<.35}});
  const t0=performance.now();
  (function frame(t){
    const e=t-t0;ctx.clearRect(0,0,W,H);
    const alpha=e<1500?1:Math.max(0,1-(e-1500)/900);
    parts.forEach(p=>{p.vy+=.22;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=p.c;ctx.translate(p.x,p.y);ctx.rotate(p.r);
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      ctx.restore()});
    if(e<2400)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}

/* --- light / dark switch (follows the device until you choose) --- */
const THEME_KEY='gmlf-theme';
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
function effTheme(){const t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;try{return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){return 'light'}}
function renderThemeBtn(){const dark=effTheme()==='dark',b=$('themeBtn');b.innerHTML=dark?SUN:MOON;b.setAttribute('aria-label',dark?'Bytt til lyst tema':'Bytt til mørkt tema')}
try{const t=localStorage.getItem(THEME_KEY);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
$('themeBtn').onclick=()=>{
  const n=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem(THEME_KEY,n)}catch(e){}
  renderThemeBtn();retrigger($('themeBtn'),'spin');
};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderThemeBtn)}catch(e){}
try{new MutationObserver(renderThemeBtn).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}

function render(){
  const p=PLAN[S.idx], st=S.status;
  const ph=$('phase');
  if(st==='idle'){ph.className='phase idle';ph.textContent='Klar?'}
  else if(st==='finished'){ph.className='phase idle';ph.textContent='Ferdig for nå!'}
  else if(st==='between'){const n=PLAN[S.idx+1];ph.className='phase '+n.type;ph.textContent='Neste opp · '+(n.type==='focus'?'Fokus':'Pause')}
  else{ph.className='phase '+p.type;ph.textContent=(st==='paused'?'På vent · ':'')+(p.type==='focus'?'Fokus':'Pause')}

  const ring=$('ring');
  ring.classList.toggle('paused',st==='paused');ring.classList.toggle('running',st==='running');
  document.body.dataset.phase=st==='idle'||st==='finished'?'idle':st==='between'?PLAN[S.idx+1].type:p.type;
  const fIdx=PLAN.slice(0,S.idx+1).filter(x=>x.type==='focus').length;
  $('round').textContent=st==='idle'?'9 runder · 200 min':st==='finished'?'Alle 9 runder':`Runde ${S.idx+1} av 9`;
  $('meta').textContent=
    st==='idle'?'Trykk «Lås inn», så kjører vi på.':
    st==='finished'?'Alle 9 rundene er unnagjort. Trykk «Lås inn» for en runde til.':
    st==='between'?labelFor(S.idx+1)+' venter på deg.':
    labelFor(S.idx)+(st==='paused'?' · på vent':'');

  $('pauseBtn').hidden=!(st==='running'||st==='paused');
  $('pauseBtn').textContent=st==='paused'?'Kjør på':'Ta en pust';
  $('skipBtn').hidden=!(st==='running'||st==='paused');
  $('nextBtn').hidden=st!=='between';
  if(st==='between'){const n=PLAN[S.idx+1];$('nextBtn').textContent=`La oss gå · ${n.m} min ${n.type==='focus'?'fokus':'pause'}`;$('nextBtn').className='primary '+n.type}
  if(!$('startNew').dataset.confirm)$('startNew').textContent=st==='idle'||st==='finished'?'Lås inn':'Begynn på nytt';
  $('startNew').className=(st==='idle'||st==='finished')?'primary':'ghost';

  const a=$('alert');
  if(st==='between'){const n=PLAN[S.idx+1];a.hidden=false;a.className='alert '+n.type;$('alertBtn').className='primary '+n.type;
    $('alertText').textContent=(PLAN[S.idx].type==='focus'?`Bra jobba! Ta ${n.m} min pause og sleng inn hva du fikk gjort.`:`Pausen er slutt. Nå blir det ${n.m} min fokus.`)+(S.lateEnd?` (Ferdig kl. ${hm(S.lateEnd)}.)`:'');
    $('alertBtn').textContent=`La oss gå · ${n.m} min ${n.type==='focus'?'fokus':'pause'}`;}
  else if(st==='finished'){a.hidden=false;a.className='alert sun';$('alertBtn').className='primary';$('alertText').textContent=S.saved?'Ferdig! Lista er tatt vare på.':'Ferdig! Husk å kopiere eller laste ned lista før du starter på nytt.';$('alertBtn').textContent='Lås inn';$('alertBtn').onclick=()=>$('startNew').click()}
  else{a.hidden=true;$('alertBtn').onclick=goNext}

  $('autoNext').checked=!!S.auto; $('keepAwakeBox').checked=S.keepAwake!==false; renderKeep(); $('sound').checked=S.sound!==false;
  let showN=false;try{showN='Notification' in window&&Notification.permission==='default'}catch(e){}
  $('notifBtn').hidden=!showN;
  if(st!=='running')document.title=st==='paused'?'På vent · Gi meg litt fred':(flashTimer?document.title:'Gi meg litt fred');
  renderClock(); renderLog(); startLoop(); renderLamp(); lampSend();
  if(justFinished&&!$('export').hidden){justFinished=false;try{$('export').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}}
  justFinished=false;
}

buildRing(); buildDigits(); renderThemeBtn();
// resume after reload: a running timer that ended while the page was closed completes now
if(S.status==='running'){if(remainingNow()<=0)complete(true);else runTicker(true)}
render();
})();
</script>
